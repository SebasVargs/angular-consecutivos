<div class="public-container">
  <div class="public-header">
    <h1 class="public-title">Gestión de Documentos</h1>
  </div>

  <div class="documents-table-container">
    <table class="documents-table">
      <thead>
        <tr>
          <th>Consecutive</th>
          <th>Fecha</th>
          <th>Name</th>
          <th>Source File</th>
          <th>Estado</th>
          <th>Ver</th>
        </tr>
      </thead>
      <tbody>
        <!-- Utilizamos *ngFor para iterar sobre los documentos -->
        <tr *ngFor="let conDocs of docsConsecList">
          <td>{{ conDocs.id_consecutive }}</td>
          <td>{{ conDocs.date_document | date:'dd/MM/yyyy' }}</td>
          <td>{{ conDocs.user_name}}</td>
          <td>{{ conDocs.source_file }}</td>
          <td>
            <span class="status-badge"
                  [ngClass]="{
                    'status-pending': conDocs.id_status_name === 'Pendiente',
                    'status-approved': conDocs.id_status_name === 'Aprobado',
                    'status-rejected': conDocs.id_status_name === 'Rechazado',
                    'status-processing': conDocs.id_status_name === 'En Proceso'
                  }">
              {{ conDocs.id_status_name }}
            </span>
          </td>
          <td>
            <button class="btn btn-secondary btn-sm" *ngIf="conDocs.source_file">
              Descargar
            </button>
            <span *ngIf="!conDocs.source_file">No disponible</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
