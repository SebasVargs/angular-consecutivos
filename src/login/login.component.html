<div class="login-container">
  <h2>Log in</h2>
  <div class="login-form-card">
    <div *ngIf="!requestSent && !verifyingToken">
      <h3>Solicitar Código de Acceso</h3>
      <form (ngSubmit)="requestAccessCode()">
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required>
        </div>
        <button type="submit" class="btn">Enviar Código</button>
      </form>
      <div *ngIf="message" class="message">{{ message }}</div>
      <div *ngIf="error" class="error">{{ error }}</div>
    </div>

    <div *ngIf="requestSent && !verifyingToken">
      <h3>Ingresar Código de Acceso</h3>
      <p>Se ha enviado un código de acceso a tu correo electrónico. Por favor, ingresa el código aquí:</p>
      <form (ngSubmit)="loginWithToken()">
        <div class="form-group">
          <label for="token">Código de Acceso:</label>
          <input type="text" id="token" name="token" [(ngModel)]="token" required>
        </div>
        <button type="submit" class="btn">Acceder</button>
      </form>
      <div *ngIf="error" class="error">{{ error }}</div>
    </div>

    <div *ngIf="verifyingToken">
      <p>Verificando código...</p>
    </div>
  </div>
</div>
